<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Debate: Bitcoin</title>
  <style>
    :root {
      --bg: #1b1c1d;
      --card: #38393a;
      --gold: #e8d77a;
      --orange: #f7931a;
      --green: #2e6b34;
      --red: #8a1f1c;
      --g2: #5fd068;
      --r2: #ff6b64
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, Segoe UI, Roboto, sans-serif;
      min-height: 100vh
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px
    }

    .host .wrap {
      max-width: 1100px
    }

    h1,
    h2 {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--gold);
      font-weight: 400;
      margin: .2em 0 .5em
    }

    h1 {
      font-size: 2rem
    }

    h2 {
      font-size: 1.4rem;
      line-height: 1.3
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0
    }

    .muted {
      color: #c9c9c9;
      font-size: .95rem
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 0;
      margin: 8px 0
    }

    button {
      font-size: 1.1rem;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      color: #fff;
      font-weight: 600
    }

    button:disabled {
      opacity: .5
    }

    .btn {
      background: var(--orange);
      width: 100%
    }

    .row {
      display: flex;
      gap: 12px
    }

    .row>* {
      flex: 1
    }

    .favor {
      background: var(--green)
    }

    .contra {
      background: var(--red)
    }

    .vote {
      padding: 22px 10px;
      font-size: 1.3rem;
      border: 3px solid transparent
    }

    .vote.sel {
      border-color: #fff
    }

    .arg {
      border-radius: 10px;
      padding: 12px;
      margin: 8px 0;
      font-size: .95rem;
      line-height: 1.4
    }

    .tag {
      font-size: .8rem;
      letter-spacing: .08em;
      color: #ddd;
      display: block;
      margin-bottom: 4px
    }

    .bars {
      margin: 10px 0
    }

    .bar {
      display: flex;
      align-items: center;
      margin: 8px 0;
      gap: 10px
    }

    .bar .l {
      width: 80px
    }

    .bar .t {
      flex: 1;
      background: #2a2b2c;
      border-radius: 6px;
      height: 34px;
      overflow: hidden
    }

    .bar .f {
      height: 100%;
      transition: width .6s;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-weight: 700
    }

    .btc {
      color: var(--orange);
      font-weight: 700
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .9rem;
      color: #c9c9c9
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    td {
      padding: 8px 6px;
      border-bottom: 1px solid #4a4b4c
    }

    td:last-child {
      text-align: right
    }

    .big {
      font-size: 1.6rem
    }

    .host h2 {
      font-size: 1.9rem
    }

    .host .arg {
      font-size: 1.1rem
    }

    .ctrl {
      position: sticky;
      bottom: 0;
      background: #111;
      padding: 12px;
      display: flex;
      gap: 10px;
      margin: 0 -20px
    }

    .ctrl button {
      flex: 1
    }

    .gray {
      background: #555
    }

    .pill {
      display: inline-block;
      background: #111;
      border-radius: 99px;
      padding: 4px 12px;
      font-size: .85rem;
      margin-right: 6px
    }

    .speaker-box {
      background: linear-gradient(135deg, #2b2510, #382c0b);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
      text-align: center;
      box-shadow: 0 4px 16px rgba(232, 215, 122, 0.15);
      animation: pop 0.25s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.97); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .timer-card {
      background: #252627;
      border: 1px solid #484a4d;
      border-radius: 10px;
      padding: 12px 16px;
      margin: 12px 0;
      transition: border-color 0.3s;
    }
    .timer-digits {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .timer-bar-track {
      width: 100%;
      height: 6px;
      background: #191a1b;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .timer-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 0.4s linear, background-color 0.4s;
    }
    .timer-warning {
      color: #f1c40f !important;
    }
    .timer-urgent {
      color: var(--r2) !important;
      animation: timerPulse 0.9s infinite ease-in-out;
    }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .timer-expired {
      color: var(--r2) !important;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="wrap" id="app"></div>
  <script>
    const IS_HOST = location.pathname === '/host';
    if (IS_HOST) document.body.classList.add('host');
    const $ = (h) => { document.getElementById('app').innerHTML = h; };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmt = (n) => (Math.round(n * 1000) / 1000).toFixed(3).replace('.', ',') + ' BTC';
    let token = localStorage.getItem('token');
    let hostKey = sessionStorage.getItem('hostKey');
    let S = null, err = '', lastVote = null;
const brl = (n) => 'R$ ' + Math.round(n).toLocaleString('pt-BR');

    const fmtTime = (sec) => {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    function calcTimerInfo() {
      if (!S || !S.timer) return null;
      const t = S.timer;
      if (t.state === 'paused') {
        const rem = Math.max(0, t.remaining || 0);
        const pct = t.duration > 0 ? Math.min(100, Math.max(0, (rem / t.duration) * 100)) : 0;
        return { rem, total: t.duration, state: 'paused', pct };
      }
      if (t.state === 'running' && t.endTime) {
        const skew = (S.serverNow && S._fetchTime) ? (Date.now() - S._fetchTime) : 0;
        const nowServer = (S.serverNow || Date.now()) + skew;
        const rem = Math.max(0, Math.ceil((t.endTime - nowServer) / 1000));
        const pct = t.duration > 0 ? Math.min(100, Math.max(0, (rem / t.duration) * 100)) : 0;
        return { rem, total: t.duration, state: rem === 0 ? 'expired' : 'running', pct };
      }
      return null;
    }

    async function api(path, body) {
      const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-host-key': hostKey || '' }, body: JSON.stringify(body) } : { headers: { 'x-host-key': hostKey || '' } });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Erro');
      return j;
    }

    const bars = (c, title, q) => {
      const t = (c.favor + c.contra) || 1;
      const labelA = (q && q.optA) || 'A favor';
      const labelB = (q && q.optB) || 'Contra';
      const row = (l, n, cls) => `<div class="bar"><div class="l" style="width:140px;font-weight:600">${esc(l)}</div><div class="t"><div class="f ${cls}" style="width:${Math.max(n / t * 100, n ? 8 : 0)}%">${n}</div></div><div style="min-width:40px;text-align:right">${Math.round(n / t * 100)}%</div></div>`;
      return `<div class="bars"><div class="muted" style="margin-bottom:6px">${title}</div>${row(labelA, c.favor, 'favor')}${row(labelB, c.contra, 'contra')}</div>`;
    };
    const rankTable = (r, n) => `<table>${r.slice(0, n || r.length).map((p, i) => `<tr><td>${i + 1}º</td><td>${esc(p.nick)}</td><td class="btc">${fmt(p.btc)}<div class="muted" style="font-weight:400">${brl(p.brl)}</div></td></tr>`).join('')}</table>`;

    const stepName = { v1: 'Voto 1', r1: 'Resultado do voto 1', v2: 'Voto 2 (depois do debate)', r2: 'Resultado final da pergunta' };

    function questionBlock(s) {
      return `<h2>Pergunta ${s.q + 1} de ${s.total}</h2><div class="card big" style="font-size:1.2rem;line-height:1.4">${esc(s.question.title)}</div>`;
    }
    function argsBlock(s) {
      const labelA = (s.question && s.question.optA) || 'A FAVOR';
      const labelB = (s.question && s.question.optB) || 'CONTRA';
      const descA = (s.question && s.question.descA) || s.question.favor;
      const descB = (s.question && s.question.descB) || s.question.contra;
      return `<div class="arg favor"><span class="tag">🟢 ${esc(labelA.toUpperCase())}</span>${esc(descA)}</div><div class="arg contra"><span class="tag">🔴 ${esc(labelB.toUpperCase())}</span>${esc(descB)}</div>`;
    }

    // -------- Jogador --------
    function renderPlayer() {
      const s = S;
      if (!token || !s.me) return renderJoin();
      let h = `<div class="top"><span>👤 ${esc(s.me.nick)}</span><span class="btc">${fmt(s.me.btc)} · ${brl(s.me.brl)}</span></div>`;
      if (s.kind === 'lobby') {
        if (s.me.late) h += '<div class="card" style="background:#5a4a12">Você entrou com o jogo em andamento: as perguntas já encerradas não contam. Nas próximas, você concorre normalmente!</div>';
    h += `<h1>Você está dentro!</h1><div class="card">Aguarde o início do debate. ${s.players} pessoas na sala.<br><br><span class="muted">Cada pergunta vale ${fmt(s.prize)}. Quem fica na maioria do 2º voto ganha: manteve o voto = 100%, mudou de opinião = 50%. Quem fica na minoria ganha zero.<br><br>No final, convertemos seu saldo para reais pela cotação do bitcoin (${brl(s.price.brl)} por BTC).</span></div>`;
      } else if (s.kind === 'final') {
        const pos = s.ranking.findIndex((p) => p.nick === s.me.nick) + 1;
        h += `<h1>Fim do debate!</h1><div class="card big">Você ficou em <b>${pos}º</b> com <span class="btc">${fmt(s.me.btc)}</span><div class="muted" style="font-size:1rem">Na vida real, isso seria <b>${brl(s.me.brl)}</b> (BTC a ${brl(s.price.brl)})</div></div>`;
        if (pos === 1) {
          h += `<div class="card" style="background:#18361b;border:2px solid #5fd068;text-align:center;padding:16px">
            <div style="font-size:1.5rem;font-weight:700;color:#5fd068">🏆 1º LUGAR INCONTESTÁVEL!</div>
            <div style="font-size:0.95rem;margin-top:4px;color:#eee">Você conquistou o topo do ranking final e levou a premiação do debate!</div>
          </div>`;
        }
        h += `<h2>Ranking Final</h2><div class="card">${rankTable(s.ranking, 10)}</div>`;
        h += `<div class="card muted" style="font-size:0.85rem"><b>Critérios oficiais de desempate:</b> 1º Saldo BTC ➔ 2º Firmeza no debate (manteve o voto na maioria) ➔ 3º Agilidade do voto</div>`;
      } else {
        const tInfo = calcTimerInfo();
        if (tInfo) {
          let cls = '';
          let statusTxt = 'Tempo restante';
          if (tInfo.state === 'paused') { statusTxt = 'Cronômetro pausado'; }
          else if (tInfo.rem === 0) { cls = 'timer-expired'; statusTxt = 'Tempo esgotado!'; }
          else if (tInfo.rem <= 15) { cls = 'timer-urgent'; }
          else if (tInfo.rem <= 60) { cls = 'timer-warning'; }
          const barColor = tInfo.rem <= 15 ? 'var(--r2)' : tInfo.rem <= 60 ? '#f1c40f' : 'var(--gold)';

          h += `<div class="timer-card" id="player-timer-card" style="border-color:${tInfo.rem <= 15 && tInfo.state === 'running' ? 'var(--r2)' : '#484a4d'}">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:0.95rem;font-weight:600">⏱️ <span id="player-timer-status">${statusTxt}</span></span>
              <span id="player-timer-digits" class="timer-digits ${cls}" style="font-size:1.35rem">${tInfo.rem === 0 ? '00:00' : fmtTime(tInfo.rem)}</span>
            </div>
            <div class="timer-bar-track">
              <div id="player-timer-fill" class="timer-bar-fill" style="width:${tInfo.pct}%;background-color:${barColor}"></div>
            </div>
          </div>`;
        }
        h += questionBlock(s);
        const step = s.step;
        if (step === 'v1' || step === 'v2') {
          const server = step === 'v1' ? s.myV1 : s.myV2;
          const mine = lastVote && lastVote.key === s.phase && Date.now() - lastVote.t < 4000 ? lastVote.choice : server;
          const optA = (s.question && s.question.optA) || 'A FAVOR';
          const optB = (s.question && s.question.optB) || 'CONTRA';
          h += `<div class="muted">${stepName[step]}: escolha o seu posicionamento</div>`;
          h += `<div class="row" style="margin:10px 0"><button class="vote favor ${mine === 'favor' ? 'sel' : ''}" onclick="vote('favor')">🟢 ${esc(optA)}</button><button class="vote contra ${mine === 'contra' ? 'sel' : ''}" onclick="vote('contra')">🔴 ${esc(optB)}</button></div>`;
          h += mine ? `<div class="card">✅ Voto registrado. Você pode trocar até o fechamento.</div>` : `<div class="card muted">Ainda sem voto.</div>`;
          h += argsBlock(s);
        } else if (step === 'r1') {
          h += bars(s.results, 'Resultado do voto 1', s.question);
          if (s.speaker) {
            const isMe = s.me && s.speaker.nick.toLowerCase() === s.me.nick.toLowerCase();
            if (isMe) {
              h += `<div class="speaker-box" style="border-color:#5fd068;background:#18361b;margin:12px 0">
                <div style="font-size:1.15rem;font-weight:700;color:#5fd068">🎤 VOCÊ FOI SORTEADO(A) PARA FALAR!</div>
                <div style="font-size:0.95rem;margin-top:4px">Compartilhe e defenda seus argumentos com a sala agora!</div>
              </div>`;
            } else {
              const optA = (s.question && s.question.optA) || 'A FAVOR';
              const optB = (s.question && s.question.optB) || 'CONTRA';
              const vTxt = s.speaker.vote === 'favor' ? ` (Votou: ${optA})` : s.speaker.vote === 'contra' ? ` (Votou: ${optB})` : '';
              h += `<div class="card" style="background:#28261a;border-left:4px solid var(--gold);padding:12px 14px;font-size:1rem">
                🎤 <b>${esc(s.speaker.nick)}</b> foi sorteado(a) para falar${esc(vTxt)}. Ouça a argumentação!
              </div>`;
            }
          }
          const meuVoto = s.myV1 === 'favor' ? ((s.question && s.question.optA) || 'A FAVOR') : s.myV1 === 'contra' ? ((s.question && s.question.optB) || 'CONTRA') : 'não votou';
          h += `<div class="card">Seu voto: <b>${esc(meuVoto)}</b>. Hora do debate: fale e ouça!</div>` + argsBlock(s);
        } else {
          h += bars(s.resultsV1, 'Voto 1', s.question) + bars(s.resultsV2, 'Voto 2', s.question);
          const msg = s.myReward > 0 ? (s.changed ? 'Você mudou de opinião e ficou na maioria: 50%.' : 'Você manteve o voto e ficou na maioria: 100%!') : 'Desta vez você não ganhou.';
          h += `<div class="card big">${s.myReward > 0 ? '🎉 +' + fmt(s.myReward) + ' (' + brl(s.myRewardBrl) + ')' : '😶 0 BTC'}<div class="muted" style="font-size:.95rem">${msg}</div></div><h2>Top 5</h2><div class="card">${rankTable(s.ranking)}</div>`;
        }
      }
      if (err) h += `<div class="card" style="background:var(--red)">${esc(err)}</div>`;
      $(h);
    }
    function renderJoin() {
      const el = document.getElementById('nick');
      if (el && document.activeElement === el) return;
      $(`<h1>₿ Debate Bitcoin</h1><div class="card"><p>Escolha um apelido para entrar. Sem cadastro. Os bitcoins são fictícios!</p><input id="nick" maxlength="20" placeholder="Seu apelido" autocomplete="off"><button class="btn" onclick="join()">Entrar</button>${err ? `<p style="color:var(--r2)">${esc(err)}</p>` : ''}</div>`);
    }
    async function join() {
      try {
        const nick = document.getElementById('nick').value;
        const r = await api('/api/join', { nick, token });
        token = r.token; localStorage.setItem('token', token); err = ''; poll();
      } catch (e) { err = e.message; renderJoin(); }
    }
    async function vote(choice) {
      try { await api('/api/vote', { token, choice }); err = ''; lastVote = { key: S.phase, choice, t: Date.now() }; } catch (e) { err = e.message; }
      poll();
    }

    // -------- Apresentador --------
    function renderHost() {
      const s = S;
  if (document.activeElement && document.activeElement.id === 'price') return;
      if (!hostKey) {
        const el = document.getElementById('key');
        if (el && document.activeElement === el) return;
        return $(`<h1>Painel do apresentador</h1><div class="card"><input id="key" type="password" placeholder="Chave"><button class="btn" onclick="setKey()">Entrar</button></div>`);
      }
      let h = `<div class="top"><span><span class="pill">👥 ${s.players} na sala</span><span class="pill">Fase ${s.phase}/${s.last}</span></span><span>${esc(location.origin)}</span></div>`;
      let nextLabel = 'Avançar ▶';
      if (s.kind === 'lobby') {
        h += `<h1>Debate: Bitcoin</h1><div class="card big">Entre em <b>${esc(location.origin)}</b><br><span class="muted">Basta digitar um apelido.</span></div>`;
        h += `<div class="card"><img alt="" id="qr" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(location.origin)}" onerror="this.remove()"></div>`;
        h += `<div class="card">${s.ranking.map((p) => esc(p.nick)).join(' · ') || '<span class="muted">Ninguém entrou ainda</span>'}</div>`;
        nextLabel = 'Começar ▶';
      } else if (s.kind === 'final') {
        const champ = s.ranking && s.ranking[0];
        h += `<h1>🏆 Vencedor do Debate</h1>`;
        if (champ) {
          h += `<div class="card big" style="background:linear-gradient(135deg,#2e260e,#4a3a10);border:2px solid var(--gold);text-align:center;padding:22px;margin-bottom:16px">
            <div style="font-size:1rem;letter-spacing:0.12em;color:var(--gold);font-weight:700">1º LUGAR INCONTESTÁVEL</div>
            <div style="font-size:2.8rem;font-weight:700;color:#fff;margin:8px 0">🥇 ${esc(champ.nick)}</div>
            <div style="font-size:1.3rem"><span class="btc">${fmt(champ.btc)}</span> <span class="muted">(equiv. a ${brl(champ.brl)})</span></div>
            <div class="muted" style="font-size:0.9rem;margin-top:8px">Firmeza de voto: ${champ.heldCount} rodadas | Votação ágil</div>
          </div>`;
        }
        h += `<h2>Ranking Geral</h2><div class="card big">${rankTable(s.ranking, 15)}</div>`;
        h += `<div class="card muted" style="font-size:0.85rem"><b>Critérios oficiais de desempate:</b> 1º Saldo BTC ➔ 2º Firmeza no debate (manteve o voto na maioria) ➔ 3º Agilidade do voto</div>`;
        nextLabel = 'Fim';
      } else {
        h += `<span class="pill">${stepName[s.step]}</span>`;

        const tInfo = calcTimerInfo();
        let timerDigits = '00:00';
        let timerPct = 0;
        let badgeHtml = '<span class="pill gray">Parado</span>';
        let ctrlBtns = '';
        let barColor = 'var(--gold)';
        let cls = '';

        if (tInfo) {
          timerDigits = fmtTime(tInfo.rem);
          timerPct = tInfo.pct;
          if (tInfo.state === 'paused') {
            badgeHtml = '<span class="pill" style="background:#5a4a12;color:#f1c40f">⏸️ Pausado</span>';
            ctrlBtns = `<button class="favor" style="padding:6px 14px;font-size:0.85rem" onclick="resumeTimer()">▶️ Retomar</button> <button class="gray" style="padding:6px 14px;font-size:0.85rem" onclick="resetTimer()">⏹️ Zerar</button>`;
          } else if (tInfo.state === 'expired') {
            cls = 'timer-expired';
            timerDigits = '00:00 (Esgotado)';
            barColor = 'var(--r2)';
            badgeHtml = '<span class="pill contra">⏰ Esgotado</span>';
            ctrlBtns = `<button class="gray" style="padding:6px 14px;font-size:0.85rem" onclick="resetTimer()">⏹️ Limpar</button>`;
          } else {
            badgeHtml = '<span class="pill favor">⏱️ Rodando</span>';
            if (tInfo.rem <= 15) { cls = 'timer-urgent'; barColor = 'var(--r2)'; }
            else if (tInfo.rem <= 60) { cls = 'timer-warning'; barColor = '#f1c40f'; }
            ctrlBtns = `<button class="gray" style="padding:6px 12px;font-size:0.85rem" onclick="pauseTimer()">⏸️ Pausar</button> <button class="gray" style="padding:6px 12px;font-size:0.85rem" onclick="addTimer(30)">+30s</button> <button class="gray" style="padding:6px 12px;font-size:0.85rem" onclick="resetTimer()">⏹️ Zerar</button>`;
          }
        }

        h += `<div class="card" style="background:#222324;border:1px solid ${tInfo && tInfo.rem <= 15 && tInfo.state === 'running' ? 'var(--r2)' : '#484a4d'};margin:12px 0">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-weight:700;color:var(--gold);font-size:1.05rem">⏱️ Cronômetro:</span>
              <span id="host-timer-digits" class="timer-digits ${cls}" style="font-size:1.6rem">${timerDigits}</span>
              <span id="host-timer-badge">${badgeHtml}</span>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              ${ctrlBtns}
            </div>
          </div>
          <div class="timer-bar-track">
            <div id="host-timer-fill" class="timer-bar-fill" style="width:${timerPct}%;background-color:${barColor}"></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px">
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <span class="muted" style="font-size:0.85rem">Iniciar:</span>
              <button class="gray" style="padding:6px 12px;font-size:0.85rem" onclick="startTimer(60)">1 min</button>
              <button class="gray" style="padding:6px 12px;font-size:0.85rem" onclick="startTimer(120)">2 min</button>
              <button class="gray" style="padding:6px 12px;font-size:0.85rem" onclick="startTimer(180)">3 min</button>
              <button class="btn" style="width:auto;padding:6px 14px;font-size:0.85rem;background:var(--orange)" onclick="startTimer(300)">⏱️ 5 min</button>
            </div>
            <span class="muted" style="font-size:0.8rem">Você controla o encerramento no botão principal abaixo</span>
          </div>
        </div>`;

        h += questionBlock(s);
        if (s.step === 'v1' || s.step === 'v2') {
          h += `<div class="card big">🗳️ ${s.voted} de ${s.players} já votaram</div>` + argsBlock(s);
          nextLabel = 'Fechar votação e mostrar resultado ▶';
        } else if (s.step === 'r1') {
          const optA = (s.question && s.question.optA) || 'A FAVOR';
          const optB = (s.question && s.question.optB) || 'CONTRA';
          h += bars(s.results, 'Resultado do Voto 1', s.question);
          h += `<div class="card" style="background:#252627;border:1px dashed #666;margin:14px 0">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <span style="font-weight:700;color:var(--gold);font-size:1.05rem">🎤 Vez de Falar no Debate (Opcional)</span>
              <span class="muted" style="font-size:0.85rem">Use se a sala estiver tímida</span>
            </div>`;
          if (s.speaker) {
            const vBadge = s.speaker.vote === 'favor' ? `<span class="pill favor">Votou: ${esc(optA)}</span>` : s.speaker.vote === 'contra' ? `<span class="pill contra">Votou: ${esc(optB)}</span>` : '<span class="pill gray">Sem voto</span>';
            h += `<div class="speaker-box">
              <div style="font-size:0.85rem;letter-spacing:0.1em;color:var(--gold);margin-bottom:4px">SORTEADO(A) PARA FALAR:</div>
              <div style="font-size:2.2rem;font-weight:700;color:#fff;margin:6px 0">🎤 ${esc(s.speaker.nick)}</div>
              <div style="margin-top:6px">${vBadge}</div>
              <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
                <button class="gray" style="padding:8px 16px;font-size:0.95rem" onclick="drawSpeaker('${esc(s.speaker.filter || 'all')}')">🎲 Sortear Outro</button>
                <button class="gray" style="padding:8px 16px;font-size:0.95rem" onclick="clearSpeaker()">✖ Limpar</button>
              </div>
            </div>`;
          } else {
            h += `<div style="font-size:0.95rem;margin-bottom:10px" class="muted">Se alguém levantar a mão por vontade própria, basta deixar falar. Caso contrário, você pode sortear:</div>
            <div class="row">
              <button class="gray" style="padding:12px 8px;font-size:0.95rem" onclick="drawSpeaker('all')">🎲 Sortear Qualquer Aluno</button>
              <button class="favor" style="padding:12px 8px;font-size:0.95rem" onclick="drawSpeaker('favor')">🟢 Quem votou "${esc(optA)}"</button>
              <button class="contra" style="padding:12px 8px;font-size:0.95rem" onclick="drawSpeaker('contra')">🔴 Quem votou "${esc(optB)}"</button>
            </div>`;
          }
          h += `</div>` + argsBlock(s);
          nextLabel = 'Abrir voto 2 ▶';
        } else {
          h += bars(s.resultsV1, 'Voto 1', s.question) + bars(s.resultsV2, 'Voto 2', s.question) + `<div class="card">🔄 ${s.changedCount} pessoa(s) mudaram de opinião.</div><h2>Top 5</h2><div class="card">${rankTable(s.ranking, 5)}</div>`;
          nextLabel = s.q === s.total - 1 ? 'Ver ranking final ▶' : 'Próxima pergunta ▶';
        }
      }
      h += `<div class="card muted">Cotação usada: <b>${brl(s.price.brl)}</b> por BTC (${s.price.source}). Definir manualmente: <input id="price" style="width:160px;display:inline" placeholder="ex.: 450000"> <button class="gray" style="padding:8px 14px" onclick="setPrice()">Aplicar</button> (vazio = automático)</div><div class="ctrl"><button class="gray" onclick="act('back')" ${s.phase === 0 ? 'disabled' : ''}>◀ Voltar</button><button class="btn" onclick="act('next')" ${s.phase >= s.last ? 'disabled' : ''}>${nextLabel}</button><button class="gray" style="flex:.4" onclick="if(confirm('Apagar tudo e reiniciar?'))act('reset')">Reiniciar</button></div>`;
      $(h);
    }
    function setKey() { hostKey = document.getElementById('key').value; sessionStorage.setItem('hostKey', hostKey); poll(); }
    async function setPrice() { try { await api('/api/host', { action: 'price', value: document.getElementById('price').value }); } catch (e) { alert(e.message); } poll(); }
    async function drawSpeaker(filter) { try { await api('/api/host', { action: 'draw_speaker', filter }); } catch (e) { alert(e.message); } poll(); }
    async function clearSpeaker() { try { await api('/api/host', { action: 'clear_speaker' }); } catch (e) { alert(e.message); } poll(); }
    async function startTimer(sec) { try { await api('/api/host', { action: 'timer_start', duration: sec }); } catch (e) { alert(e.message); } poll(); }
    async function pauseTimer() { try { await api('/api/host', { action: 'timer_pause' }); } catch (e) { alert(e.message); } poll(); }
    async function resumeTimer() { try { await api('/api/host', { action: 'timer_resume' }); } catch (e) { alert(e.message); } poll(); }
    async function addTimer(sec) { try { await api('/api/host', { action: 'timer_add', seconds: sec }); } catch (e) { alert(e.message); } poll(); }
    async function resetTimer() { try { await api('/api/host', { action: 'timer_reset' }); } catch (e) { alert(e.message); } poll(); }
    async function act(action) { try { await api('/api/host', { action }); } catch (e) { alert(e.message); if (/chave/i.test(e.message)) { hostKey = null; sessionStorage.removeItem('hostKey'); } } poll(); }

    let isPolling = false;
    async function poll() {
      if (isPolling) return;
      isPolling = true;
      try {
        S = await api('/api/state?token=' + encodeURIComponent(token || ''));
        S._fetchTime = Date.now();
        if (IS_HOST) {
          if (hostKey && S.ranking === undefined) { hostKey = null; sessionStorage.removeItem('hostKey'); }
          renderHost();
        } else renderPlayer();
      } catch (e) { /* mantém tela */ }
      finally { isPolling = false; }
    }

    function tickTimer() {
      const info = calcTimerInfo();
      if (!info) return;

      const digits = info.rem === 0 ? '00:00' : fmtTime(info.rem);
      const barColor = info.rem <= 15 ? 'var(--r2)' : info.rem <= 60 ? '#f1c40f' : 'var(--gold)';

      // Player elements
      const pDigits = document.getElementById('player-timer-digits');
      const pBar = document.getElementById('player-timer-fill');
      const pStatus = document.getElementById('player-timer-status');
      if (pDigits && pBar) {
        pDigits.textContent = info.rem === 0 ? '00:00 (Esgotado!)' : digits;
        pDigits.className = 'timer-digits ' + (info.rem === 0 ? 'timer-expired' : info.rem <= 15 ? 'timer-urgent' : info.rem <= 60 ? 'timer-warning' : '');
        pBar.style.width = info.pct + '%';
        pBar.style.backgroundColor = barColor;
        if (pStatus) {
          pStatus.textContent = info.state === 'paused' ? 'Cronômetro pausado' : info.rem === 0 ? 'Tempo esgotado!' : 'Tempo restante';
        }
      }

      // Host elements
      const hDigits = document.getElementById('host-timer-digits');
      const hBar = document.getElementById('host-timer-fill');
      if (hDigits && hBar) {
        hDigits.textContent = info.rem === 0 ? '00:00 (Esgotado)' : digits;
        hDigits.className = 'timer-digits ' + (info.rem === 0 ? 'timer-expired' : info.rem <= 15 ? 'timer-urgent' : info.rem <= 60 ? 'timer-warning' : '');
        hBar.style.width = info.pct + '%';
        hBar.style.backgroundColor = barColor;
      }
    }
    setInterval(tickTimer, 500);

    async function pollLoop() {
      await poll();
      setTimeout(pollLoop, 2800);
    }
    pollLoop();
  </script>
</body>

</html>
